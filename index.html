<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5ea83f">
  <title>Ферма маленького милого призрака</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div class="hud-top ui-layer">
      <div class="profile">
        <div class="avatar">
          <svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="20" rx="9" ry="8.5" fill="#f6c9a0" stroke="#3d2b1f" stroke-width="1.4"/><ellipse cx="16" cy="11.5" rx="14" ry="4.2" fill="#e9c46a" stroke="#3d2b1f" stroke-width="1.4"/><path d="M9 11.5 Q9 3 16 3 Q23 3 23 11.5Z" fill="#e9c46a" stroke="#3d2b1f" stroke-width="1.4"/><rect x="9" y="9" width="14" height="2.6" fill="#d65a3c"/><circle cx="12.6" cy="20" r="1.2" fill="#3d2b1f"/><circle cx="19.4" cy="20" r="1.2" fill="#3d2b1f"/><path d="M13.5 24 Q16 26 18.5 24" stroke="#3d2b1f" stroke-width="1.1" fill="none" stroke-linecap="round"/></svg>
        </div>
        <div class="lvl">
          <div class="lvl-row"><img data-icon="star" class="ic" alt=""><b id="hud-level">1</b><span class="lvl-cap">уровень</span></div>
          <div class="xpbar"><i id="hud-xp"></i></div>
        </div>
      </div>
      <div class="wallet">
        <div class="pill"><img data-icon="coin" class="ic" alt=""><b id="hud-coins">0</b></div>
        <div class="pill"><img data-icon="gem" class="ic" alt=""><b id="hud-gems">0</b></div>
        <button class="pill" id="energy-pill"><img data-icon="energy" class="ic" alt=""><b id="hud-energy">0</b><small id="hud-energy-t"></small></button>
      </div>
    </div>

    <!-- кнопки подарка и колеса фортуны: видны, только пока есть подарок или бесплатное вращение (UI.giftTick, UI.wheelTick) -->
    <div class="hud-side ui-layer">
      <button id="btn-gift" class="gift-btn" hidden aria-label="Подарки"><i class="gift-glow"></i><img data-icon="gift" alt=""><span>Подарок</span><i class="nav-badge" id="gift-badge" hidden></i></button>
      <button id="btn-wheel" class="gift-btn wheel-btn" hidden aria-label="Колесо фортуны"><i class="gift-glow"></i><img data-icon="wheel" alt=""><span>Колесо</span></button>
    </div>

    <div class="hud-res ui-layer">
      <div class="quest-cards" id="quest-cards"></div>
      <div class="chip"><img data-icon="water" class="ic" alt=""><b id="hud-can">0</b></div>
    </div>

    <nav class="hud-bottom ui-layer">
      <button id="btn-bag" class="nav-btn"><img data-icon="bag" alt=""><span>Рюкзак</span></button>
      <button id="btn-market" class="nav-btn"><img data-icon="market" alt=""><span>Рынок</span><i class="nav-badge" id="market-badge" hidden></i></button>
      <button id="btn-quests" class="nav-btn"><img data-icon="note" alt=""><span>Задания</span><i class="nav-badge" id="quests-badge" hidden></i></button>
      <button id="btn-more" class="nav-btn"><img data-icon="more" alt=""><span>Ещё</span><i class="nav-badge" id="more-badge" hidden></i></button>
    </nav>
    <button id="btn-beds" class="fab fab-beds ui-layer" aria-label="Грядки"><img data-icon="bed" alt=""><i class="fab-badge" id="beds-badge" hidden></i></button>
    <button id="btn-center" class="fab ui-layer" aria-label="К фермеру"><img data-icon="center" alt=""></button>
    <!-- «Отменить всё»: видна, пока у призрачка есть дела (UI.queueBtn), цифра — сколько их -->
    <button id="btn-cancel" class="fab fab-cancel ui-layer" hidden aria-label="Отменить все дела" title="Отменить все дела"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg><i class="fab-badge" id="cancel-badge"></i></button>
    <div id="more-menu" class="more-menu ui-layer" hidden></div>

    <div id="move-bar" class="move-bar ui-layer" hidden>
      <div class="mb-text" id="mb-text"></div>
      <div class="mb-btns">
        <button id="mb-cancel" class="btn-s">Отмена</button>
        <button id="mb-rot" class="btn-s mb-rot" aria-label="Повернуть" title="Повернуть"><img class="ic" data-icon="rotate" alt=""></button>
        <button id="mb-store" class="btn-s">В рюкзак</button>
        <button id="mb-place" class="btn-s gold">Поставить</button>
        <button id="mb-all" class="btn-s">Убрать всё</button>
        <button id="mb-done" class="btn-s done">Готово</button>
      </div>
    </div>
    <div id="plant-bar" class="plant-bar ui-layer" hidden>
      <button id="pb-pick" class="pb-pick"><img id="pb-ic" class="pb-ic" alt=""><span class="pb-t"><b id="pb-name"></b><span id="pb-sub"></span></span><i class="pb-more">▾</i></button>
      <button id="pb-x" class="pb-x" aria-label="Закончить посадку">✕</button>
    </div>
    <div id="popup" class="popup ui-layer"></div>
    <div id="panel" class="panel"></div>
    <div id="toast" class="toast"></div>
    <div id="loading" class="loading">
      <!-- заставка: браузер скачивает только одну картинку — по ориентации экрана (tools/splash_art.py);
           пока она грузится, виден фон .loading в её цветах -->
      <picture class="ld-art">
        <source media="(orientation: landscape)" srcset="assets/splash/splash_landscape.webp">
        <img src="assets/splash/splash_portrait.webp" alt="" fetchpriority="high" onload="this.classList.add('on')">
      </picture>
      <div class="ld-title">Ферма маленького <br>милого призрака</div>
      <div class="ld-box">
        <div class="ld-bar"><i id="ld-fill"></i></div>
        <div class="ld-text" id="ld-text">Загрузка…</div>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
